{% extends "base.html" %}
{% block title %}清理中{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="page-header" style="text-align: center;">
        <div class="page-title" id="progress-title">正在清理…</div>
    </div>

    <div id="progress-section">
        <div style="margin: 24px 0;">
            <div id="current-step" style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">准备中…</div>
            <div id="step-dots" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;"></div>
        </div>

        <div id="step-stats" style="margin: 24px 0; display: none;">
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                <div style="background: var(--bg); padding: 12px; border-radius: 8px;">
                    <div id="stat-deleted" style="font-size: 24px; font-weight: 700; color: var(--danger);">0</div>
                    <div style="font-size: 12px; color: var(--text-muted);">当前步骤删除</div>
                </div>
                <div style="background: var(--bg); padding: 12px; border-radius: 8px;">
                    <div id="stat-total-deleted" style="font-size: 24px; font-weight: 700;">0</div>
                    <div style="font-size: 12px; color: var(--text-muted);">累计删除</div>
                </div>
            </div>
        </div>

        <div id="sub-progress-section" style="margin: 24px 0; display: none;">
            <div style="background: var(--bg); padding: 16px; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 13px; color: var(--text-muted);">处理进度</span>
                    <span id="sub-progress-percent" style="font-size: 18px; font-weight: 700; color: var(--accent);">0%</span>
                </div>
                <div style="background: var(--border); height: 8px; border-radius: 4px; overflow: hidden;">
                    <div id="sub-progress-bar" style="background: var(--accent); height: 100%; width: 0%; transition: width 0.3s ease;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-muted);">
                    <span>已处理 <span id="sub-progress-processed" style="color: var(--text); font-weight: 600;">0</span> / <span id="sub-progress-total">0</span> 组</span>
                    <span>本步骤删除 <span id="sub-progress-deleted" style="color: var(--danger); font-weight: 600;">0</span> 条</span>
                </div>
            </div>
        </div>

        <button id="stop-btn" type="button" class="btn btn-danger" onclick="doStop()" style="margin-top: 16px;">
            停止
        </button>
    </div>

    <div id="done-section" style="display: none;">
        <div style="font-size: 48px; margin: 24px 0;">✅</div>
        <div style="font-size: 18px; font-weight: 600; margin-bottom: 16px;" id="done-title">清理完成</div>
        <div id="done-stats" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; text-align: left;"></div>
        <a href="{{ url_for('pages_bp.index') }}" class="btn btn-primary" style="margin-top: 16px; padding: 10px 32px; font-size: 15px;">
            返回首页
        </a>
    </div>

    <div id="error-section" style="display: none;">
        <div style="font-size: 48px; margin: 24px 0;">❌</div>
        <div style="font-size: 18px; font-weight: 600; color: var(--danger); margin-bottom: 8px;">清理失败</div>
        <div id="error-msg" style="color: var(--text-secondary); margin-bottom: 16px;"></div>
        <a href="{{ url_for('cleanup_flow_bp.cleanup_page') }}" class="btn btn-primary">返回</a>
    </div>
</div>

<style>
.step-dot {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    transition: all 0.3s;
}
.step-dot.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}
.step-dot.done {
    background: var(--success);
    color: white;
    border-color: var(--success);
}
</style>

<script>
(function() {
    const streamUrl = "{{ url_for('cleanup_flow_bp.cleanup_stream') }}";
    const stopUrl = "{{ url_for('cleanup_flow_bp.cleanup_stop') }}";
    const source = new EventSource(streamUrl);

    source.addEventListener('start', function(e) {
        const el = document.getElementById('step-stats');
        if (el) el.style.display = 'block';
    });

    source.addEventListener('step', function(e) {
        const data = JSON.parse(e.data);
        const dots = document.getElementById('step-dots');
        if (!dots) return; // SPA 导航后元素可能已移除
        // Mark all existing dots as done if past
        dots.querySelectorAll('.step-dot.active').forEach(el => {
            el.classList.remove('active');
            el.classList.add('done');
        });
        // Create or update dot for this step
        let dot = document.getElementById('step-dot-' + data.step);
        if (!dot) {
            dot = document.createElement('span');
            dot.id = 'step-dot-' + data.step;
            dot.className = 'step-dot active';
            dot.textContent = data.label;
            dots.appendChild(dot);
        } else {
            dot.className = 'step-dot active';
        }
        document.getElementById('current-step').textContent = data.label;
        // 重置子进度（新步骤开始）
        document.getElementById('sub-progress-section').style.display = 'block';
        document.getElementById('sub-progress-percent').textContent = '0%';
        document.getElementById('sub-progress-bar').style.width = '0%';
        document.getElementById('sub-progress-processed').textContent = '0';
        document.getElementById('sub-progress-deleted').textContent = '0';
        document.getElementById('sub-progress-total').textContent = '?';
    });

    source.addEventListener('sub_progress', function(e) {
        const data = JSON.parse(e.data);
        const percent = data.percent || 0;
        document.getElementById('sub-progress-percent').textContent = percent + '%';
        document.getElementById('sub-progress-bar').style.width = percent + '%';
        document.getElementById('sub-progress-processed').textContent = data.processed || 0;
        document.getElementById('sub-progress-total').textContent = data.total || 0;
        document.getElementById('sub-progress-deleted').textContent = data.deleted || 0;
    });

    source.addEventListener('progress', function(e) {
        const data = JSON.parse(e.data);
        document.getElementById('stat-deleted').textContent = data.deleted;
        document.getElementById('stat-total-deleted').textContent = data.total_deleted;
    });

    source.addEventListener('done', function(e) {
        const data = JSON.parse(e.data);
        source.close();
        const progSection = document.getElementById('progress-section');
        if (!progSection) return; // SPA 导航后元素可能已移除
        progSection.style.display = 'none';
        document.getElementById('done-section').style.display = 'block';
        // Mark all steps done
        document.querySelectorAll('.step-dot').forEach(el => {
            el.classList.remove('active');
            el.classList.add('done');
        });
        let html = '';
        html += '<div style="background:var(--bg);padding:12px;border-radius:8px;"><div style="font-size:20px;font-weight:700">' + data.total_before + '</div><div style="font-size:12px;color:var(--text-muted)">清理前</div></div>';
        html += '<div style="background:var(--bg);padding:12px;border-radius:8px;"><div style="font-size:20px;font-weight:700;color:var(--danger)">' + data.total_deleted + '</div><div style="font-size:12px;color:var(--text-muted)">已删除</div></div>';
        html += '<div style="background:var(--bg);padding:12px;border-radius:8px;"><div style="font-size:20px;font-weight:700;color:var(--success)">' + data.total_after + '</div><div style="font-size:12px;color:var(--text-muted)">清理后</div></div>';
        document.getElementById('done-stats').innerHTML = html;
    });

    source.addEventListener('stopped', function(e) {
        source.close();
        const progSection = document.getElementById('progress-section');
        if (!progSection) return;
        progSection.style.display = 'none';
        document.getElementById('done-section').style.display = 'block';
        document.getElementById('done-title').textContent = '已停止清理';
    });

    source.addEventListener('error', function(e) {
        if (e.data) {
            const data = JSON.parse(e.data);
            source.close();
            const progSection = document.getElementById('progress-section');
            if (!progSection) return;
            progSection.style.display = 'none';
            document.getElementById('error-section').style.display = 'block';
            document.getElementById('error-msg').textContent = data.message || '未知错误';
        }
    });

    source.onerror = function() {
        source.close();
        const progSection = document.getElementById('progress-section');
        if (!progSection) return;
        progSection.style.display = 'none';
        document.getElementById('error-section').style.display = 'block';
        document.getElementById('error-msg').textContent = '连接中断';
    };

    window.doStop = function() {
        showConfirm('停止清理', '确定要停止清理吗？已执行的步骤不会回滚。', () => {
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('stop-btn').textContent = '正在停止…';
            fetch(stopUrl, {method: 'POST'});
        });
    };

    if (window.lucide) lucide.createIcons();
})();
</script>
{% endblock %}
