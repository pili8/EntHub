{% extends "base.html" %}
{% block title %}编辑 · {{ company.name }} · EntHub{% endblock %}

{% block content %}

<div class="page page-detail">

  <header class="detail-hero">
    <div class="detail-hero-actions">
      <a href="{{ url_for('companies_bp.company_detail', company_id=company.id) }}" class="page-btn">
        <i data-lucide="arrow-left" aria-hidden="true"></i>返回详情
      </a>
    </div>
    <h1 class="detail-name">编辑企业</h1>
    {% if company.former_name and company.former_name != '-' %}
      <p class="detail-former">曾用名 · {{ company.former_name }}</p>
    {% endif %}
  </header>

  <form action="{{ url_for('companies_bp.edit_company', company_id=company.id) }}" method="post">
    {% include '_company_form.html' %}
    <div style="display: flex; gap: 12px; margin-top: 16px;">
      <button type="submit" class="btn btn-primary">
        <i data-lucide="check" style="width:16px;height:16px"></i>
        保存
      </button>
      <a href="{{ url_for('companies_bp.company_detail', company_id=company.id) }}" class="btn btn-secondary">取消</a>
    </div>
  </form>

</div>
{% endblock %}
