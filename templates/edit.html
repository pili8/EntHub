{% extends "base.html" %}
{% block title %}编辑 · {{ company.name }} · EntHub{% endblock %}

{% block content %}
<div class="page-header">
    <a href="{{ url_for('companies_bp.company_detail', company_id=company.id) }}" class="btn btn-secondary btn-sm" style="margin-bottom: 12px">
        <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
        返回详情
    </a>
    <div class="page-title">编辑企业</div>
    <div class="page-subtitle">{{ company.name }}</div>
</div>

<form action="{{ url_for('companies_bp.edit_company', company_id=company.id) }}" method="post" style="max-width: 800px">
    {% include '_company_form.html' %}
    <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button type="submit" class="btn btn-primary">
            <i data-lucide="check" style="width:16px;height:16px"></i>
            保存
        </button>
        <a href="{{ url_for('companies_bp.company_detail', company_id=company.id) }}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
