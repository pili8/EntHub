{% extends "base.html" %}
{% block title %}录入企业 · EntHub{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">录入企业</div>
</div>

<form action="{{ url_for('add_company') }}" method="post" style="max-width: 800px">
    {% include '_company_form.html' %}
    <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button type="submit" class="btn btn-primary">
            <i data-lucide="plus" style="width:16px;height:16px"></i>
            录入
        </button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
