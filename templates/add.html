{% extends "base.html" %}
{% block title %}录入企业{% endblock %}

{% block content %}

<div class="page">

  <div class="page-header">
    <div class="page-title">录入企业</div>
    <div class="page-subtitle">粘贴工商信息自动提取，或手动录入</div>
  </div>

  <form id="add-company-form" action="{{ url_for('companies_bp.add_company') }}" method="post">

    <!-- ═══ 智能提取部分 ═══ -->
    <div class="smart-card">

      <!-- 顶部横幅：标题说明 + 快速填充 -->
      <div class="smart-banner">
        <div class="smart-banner-info">
          <div class="smart-banner-icon">
            <i data-lucide="zap" style="width:16px;height:16px;color:#fff"></i>
          </div>
          <div class="smart-banner-text">
            <div class="smart-banner-title">智能提取</div>
            <div class="smart-banner-sub">粘贴或读取剪贴板，自动识别并填充表单</div>
          </div>
        </div>
        <button type="button" id="btn-quick-fill" class="smart-quick-btn">
          <i data-lucide="zap" style="width:13px;height:13px"></i>
          快速填充
        </button>
      </div>

      <!-- 输入框（内含悬浮粘贴/清除按钮） -->
      <div class="smart-input-wrap">
        <textarea id="qe-text" class="smart-textarea" rows="3"
                  placeholder="粘贴工商信息文本（营业执照、企业公示页内容等）..."></textarea>
        <div class="smart-input-tools">
          <button type="button" id="btn-paste" class="smart-input-tool-btn" title="从剪贴板粘贴">
            <i data-lucide="clipboard-paste" style="width:12px;height:12px"></i>
            粘贴
          </button>
          <button type="button" id="btn-clear" class="smart-input-tool-btn" title="清空文本" style="display:none;">
            <i data-lucide="x" style="width:12px;height:12px"></i>
            清除
          </button>
        </div>
      </div>

      <!-- 底部操作栏：提取填充（左） | 提示方式（右） -->
      <div class="smart-toolbar">
        <div class="smart-toolbar-left">
          <button type="button" id="btn-extract" class="smart-extract-btn" disabled>
            <i data-lucide="scan" style="width:14px;height:14px"></i>
            提取填充
          </button>
          <span id="qe-char-count" class="smart-char-count">0 字</span>
        </div>
        <div class="smart-toolbar-right">
          <span class="smart-toolbar-label">提取方式</span>
          <select id="qe-method" class="smart-select" title="提取方式">
            <option value="auto" selected>自动</option>
            <option value="regex">正则</option>
            <option value="llm">大模型</option>
          </select>
        </div>
      </div>

      <div id="qe-status" class="smart-status" style="display:none;"></div>
    </div>

    <!-- ═══ 手动录入部分 ═══ -->
    <div class="manual-head">
      <div class="manual-head-title">
        <i data-lucide="pencil-line" style="width:15px;height:15px"></i>
        手动录入
      </div>
      <div class="manual-head-tools">
        <button type="button" onclick="fetchAllByName()" class="tool-btn" title="通过 API 获取工商信息">
          <i data-lucide="download-cloud" style="width:13px;height:13px"></i> 在线获取
        </button>
        <button type="button" onclick="clearAllInputs()" class="tool-btn" title="清空所有已填写字段">
          <i data-lucide="eraser" style="width:13px;height:13px"></i> 清空输入
        </button>
      </div>
    </div>

    <!-- ═══ 粘性提交栏（滚动时始终可见）═══ -->
    <div class="sticky-submit">
      <div class="ss-actions">
        <button type="submit" class="btn btn-primary">
          <i data-lucide="check" style="width:14px;height:14px;vertical-align:-2px"></i>
          确认录入
        </button>
        <a href="{{ url_for('pages_bp.index') }}" class="btn btn-secondary">取消</a>
      </div>
    </div>

    {% include '_company_form.html' %}

    <!-- ═══ 底部提交栏 ══ -->
    <div class="bottom-submit">
      <button type="submit" class="btn btn-primary">
        <i data-lucide="check" style="width:14px;height:14px;vertical-align:-2px"></i>
        确认录入
      </button>
      <a href="{{ url_for('pages_bp.index') }}" class="btn btn-secondary">取消</a>
    </div>
  </form>

</div>

<style>
/* ══════════════════════════════════════════════
   智能提取卡片
═══════════════════════════════════════════════ */
.smart-card {
  background: linear-gradient(135deg, #FFF8F4 0%, #FFF1E8 100%);
  border: 1px solid #E8C4A8;
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 24px;
}

/* 顶部横幅 */
.smart-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DC 100%);
  border-bottom: 1px solid #F0D0C0;
}
.smart-banner-info {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}
.smart-banner-icon {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.smart-banner-text { flex: 1; min-width: 0; }
.smart-banner-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-hover);
  line-height: 1.3;
}
.smart-banner-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.smart-quick-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.smart-quick-btn:hover { background: var(--accent-hover); }
.smart-quick-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.smart-textarea {
  width: 100%;
  padding: 12px 20px 36px;
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  min-height: 80px;
  max-height: 240px;
  background: var(--surface);
  color: var(--text);
  border: none;
  outline: none;
  box-sizing: border-box;
  transition: background 0.15s;
}
.smart-textarea:focus { background: #FAFAFA; }
.smart-textarea::placeholder { color: var(--text-muted); }

/* 输入框容器（相对定位） */
.smart-input-wrap {
  position: relative;
  border-bottom: 1px solid var(--border);
}
/* 输入框内悬浮工具按钮 */
.smart-input-tools {
  position: absolute;
  bottom: 8px;
  left: 12px;
  display: flex;
  gap: 4px;
  transition: left 0.2s, right 0.2s;
}
.smart-input-tools--right {
  left: auto;
  right: 12px;
}
.smart-input-tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: rgba(255,255,255,0.92);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  backdrop-filter: blur(4px);
}
.smart-input-tool-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: white;
}

/* 底部工具栏 */
.smart-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  background: #FAFAFA;
}
.smart-toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.smart-toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.smart-toolbar-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.smart-extract-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.smart-extract-btn:hover:not(:disabled) { background: var(--accent-hover); }
.smart-extract-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: #ccc;
}
.smart-char-count {
  font-size: 12px;
  color: var(--text-muted);
}
.smart-select {
  padding: 6px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 13px;
  background: white;
  color: var(--text-secondary);
  cursor: pointer;
  outline: none;
}
.smart-select:focus { border-color: var(--accent); }

/* 状态提示 */
.smart-status {
  padding: 10px 20px;
  font-size: 12px;
  border-top: 1px solid var(--border);
  background: #FFFBF5;
}

/* ═══════════════════════════════════════════════
   粘性提交栏
═══════════════════════════════════════════════ */
.sticky-submit {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 10px 16px;
  margin-bottom: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.sticky-submit .ss-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ═════════════════════════════════════════════
   底部提交栏
═══════════════════════════════════════════════ */
.bottom-submit {
  display: flex;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-top: 8px;
}

/* ═══════════════════════════════════════════════
   手动录入头部
═══════════════════════════════════════════════ */
.manual-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 0 14px;
}
.manual-head-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.manual-head-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.tool-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
{% endblock %}

{% block scripts %}
<script>
// ── 快速提取 ─────────────────────────────────────────────────────────────

const qeText = document.getElementById('qe-text');
const btnPaste = document.getElementById('btn-paste');
const btnClear = document.getElementById('btn-clear');
const btnExtract = document.getElementById('btn-extract');
const qeCharCount = document.getElementById('qe-char-count');
const qeStatus = document.getElementById('qe-status');
const qeMethod = document.getElementById('qe-method');
const inputTools = document.querySelector('.smart-input-tools');

// 输入时：控制按钮状态
qeText.addEventListener('input', updateQeState);

function updateQeState() {
  const hasText = qeText.value.trim().length > 0;
  const len = qeText.value.length;
  btnClear.style.display = hasText ? '' : 'none';
  qeCharCount.textContent = `${len} 字`;
  btnExtract.disabled = !hasText;
  if (!hasText) qeStatus.style.display = 'none';
  // 有文字时按钮移到右边，无文字时在左边
  inputTools.classList.toggle('smart-input-tools--right', hasText);
}

// 粘贴
btnPaste.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { qeText.value = text; qeText.focus(); updateQeState(); }
  } catch (e) {
    showQeStatus('error', '无法读取剪贴板，请手动 Ctrl+V');
  }
});

// 清空
btnClear.addEventListener('click', () => {
  qeText.value = '';
  updateQeState();
  qeText.focus();
});

function showQeStatus(type, msg) {
  const colors = { 'info':'var(--accent)','success':'var(--success)','warning':'var(--warning)','error':'var(--danger)' };
  qeStatus.style.display = 'block';
  qeStatus.style.color = colors[type] || 'var(--text-secondary)';
  qeStatus.innerHTML = msg;
}

// 提取核心逻辑（横幅「立即填充」与大按钮共用）
async function doExtract(triggerBtn) {
  const text = qeText.value.trim();
  if (!text) return;

  const btn = triggerBtn || btnExtract;
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px"></i> 提取中...';
  lucide.createIcons();

  try {
    const resp = await fetch('/api/quick-import/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, method: qeMethod.value })
    });
    const result = await resp.json();

    if (result.code !== 0) { showQeStatus('error', result.message); return; }

    const data = result.data;
    const fields = data.fields || {};
    if (!fields.name) { showQeStatus('warning', '未提取到企业名称，请检查文本'); return; }

    let filled = 0;
    const fieldMap = {
      'name':'name','former_name':'former_name','business_status':'business_status',
      'legal_person':'legal_person','registered_capital':'registered_capital',
      'paid_capital':'paid_capital','established_date':'established_date',
      'approved_date':'approved_date','business_term':'business_term',
      'company_type':'company_type','industry':'industry','insured_count':'insured_count',
      'enterprise_scale':'enterprise_scale','english_name':'english_name',
      'phone':'phone','email':'email','website':'website',
      'province':'province','city':'city','district':'district',
      'address':'address','annual_report_address':'annual_report_address',
      'mailing_address':'mailing_address','credit_code':'credit_code',
      'taxpayer_id':'taxpayer_id','registration_no':'registration_no',
      'org_code':'org_code','business_scope':'business_scope','shareholders':'shareholders',
    };

    for (const [key, formName] of Object.entries(fieldMap)) {
      if (fields[key] !== undefined && fields[key] !== '') {
        const input = document.querySelector(`input[name="${formName}"]`) ||
                      document.querySelector(`textarea[name="${formName}"]`);
        if (input) {
          input.value = fields[key];
          input.style.background = 'var(--accent-light)';
          setTimeout(() => { input.style.background = ''; }, 2000);
          filled++;
        }
      }
    }

    const existing = data.existing;
    const ml = {'regex':'正则','llm':'大模型','regex+llm':'正则+大模型'}[data.method_used] || data.method_used;

    if (existing) {
      showQeStatus('warning',
        `⚠️ 该企业已存在: <a href="/company/${existing.id}" style="color:var(--warning);text-decoration:underline;">${existing.name}</a> — 已填充 ${filled} 个字段（${ml}）`);
    } else {
      showQeStatus('success', `✅ ${ml}提取 ${filled} 个字段已填充，请检查后点击「录入」`);
    }

    document.querySelector('.detail-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    showQeStatus('error', '请求失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
    lucide.createIcons();
    updateQeState();
  }
}
btnExtract.addEventListener('click', () => doExtract(btnExtract));

// 横幅「立即填充」：读剪贴板 → 填入 → 提取
const btnQuickFill = document.getElementById('btn-quick-fill');
btnQuickFill.addEventListener('click', async () => {
  const orig = btnQuickFill.innerHTML;
  btnQuickFill.disabled = true;
  btnQuickFill.innerHTML = '<i data-lucide="loader" style="width:13px;height:13px"></i> 读取中...';
  lucide.createIcons();
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      showQeStatus('error', '浏览器不支持读取剪贴板，请手动粘贴后点击「提取填充」');
      qeText.focus();
      return;
    }
    const text = await navigator.clipboard.readText();
    if (!text || !text.trim()) {
      showQeStatus('warning', '剪贴板为空，请先复制工商信息文本');
      qeText.focus();
      return;
    }
    qeText.value = text;
    updateQeState();
    await doExtract(btnQuickFill);
  } catch (e) {
    showQeStatus('error', '无法读取剪贴板，请手动粘贴后点击「提取填充」');
    qeText.focus();
  } finally {
    btnQuickFill.disabled = false;
    btnQuickFill.innerHTML = orig;
    lucide.createIcons();
  }
});

// ── 实时查重 ──
const nameInput = document.getElementById('company-name-input');
if (nameInput) {
  nameInput.addEventListener('blur', async function() {
    const name = this.value.trim();
    const rd = document.getElementById('name-check-result');
    if (!rd) return;
    if (!name) { rd.innerHTML = ''; return; }
    try {
      const r = await fetch(`/api/company/check-duplicate?name=${encodeURIComponent(name)}`);
      const d = await r.json();
      if (d.data && d.data.exists) rd.innerHTML = `<span style="color:#dc2626;">⚠️ 该公司已存在 — <a href="/company/${d.data.id}" style="color:#dc2626;text-decoration:underline;">查看</a></span>`;
      else rd.innerHTML = `<span style="color:#16a34a;">✓ 未重复</span>`;
    } catch (e) { rd.innerHTML = ''; }
  });
}

// ── 在线获取 ──
async function fetchAllByName() {
  const ni = document.querySelector('input[name="name"]');
  if (!ni) return;
  const name = ni.value.trim();
  if (!name) { window._enthubToast('warning','请先输入企业名称','输入名称后再点击获取'); ni.focus(); return; }
  showConfirm('在线获取', `将通过 API 获取「${name}」的工商信息和联系方式。\n\n每次调用消耗 API 配额，请确认。`, async () => { await _doFetchAll(name); });
}
async function _doFetchAll(name) {
  window._enthubToast('info','正在获取数据...','API 调用可能需要几秒');
  try {
    const r = await fetch('/api/company/fetch-all',{ method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name}) });
    const d = await r.json();
    if (d.code===2002) { showConfirm('该公司已存在',`「${d.data.existing_name}」已在数据库中，是否仍要继续录入？`,()=>{},[{text:'查看已有',class:'btn btn-secondary',action:()=>{window.location.href=`/company/${d.data.existing_id}`}},{text:'继续录入',class:'btn btn-primary',action:'closeModal()'}]); return; }
    if (d.code!==0) { window._enthubToast('error','获取失败',d.message); return; }
    const m = d.data.mapped;
    if (!m) { window._enthubToast('warning','未找到数据','API 返回为空'); return; }
    let c=0;
    const fm={'name':'name','former_name':'former_name','business_status':'business_status','legal_person':'legal_person','registered_capital':'registered_capital','paid_capital':'paid_capital','established_date':'established_date','approved_date':'approved_date','business_term':'business_term','company_type':'company_type','industry':'industry','insured_count':'insured_count','phone':'phone','email':'email','website':'website','province':'province','city':'city','district':'district','address':'address','credit_code':'credit_code','taxpayer_id':'taxpayer_id','registration_no':'registration_no','org_code':'org_code','business_scope':'business_scope','shareholders':'shareholders'};
    for(const[ef,ff]of Object.entries(fm)){if(m[ef]!==undefined){const i=document.querySelector(`input[name="${ff}"]`)||document.querySelector(`textarea[name="${ff}"]`);if(i&&(!i.value.trim()||i.value.trim()==='-')){i.value=m[ef];c++;}}}
    window._enthubToast(c>0?'success':'info',c>0?`已填充 ${c} 个字段`:'所有字段已有数据','请检查并确认信息后点击录入');
  } catch(e) { window._enthubToast('error','操作失败',e.message); }
}
window.fetchAllByName = fetchAllByName;

// ── 清空输入（需确认） ──
function clearAllInputs() {
  showConfirm('清空输入', '将清空下方所有已填写的企业信息，此操作不可撤销，确定继续吗？', () => {
    document.querySelectorAll('form input[name], form textarea[name]').forEach(el => {
      el.value = '';
      el.style.background = '';
    });
    const rd = document.getElementById('name-check-result');
    if (rd) rd.innerHTML = '';
    window._enthubToast('success', '已清空', '所有输入字段已重置');
  });
}
window.clearAllInputs = clearAllInputs;

// ── 自动填充（从菜单/ MCP 调用时 auto_fill=1）──
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('auto_fill') !== '1') return;

  // 等页面渲染完再执行
  requestAnimationFrame(() => {
    setTimeout(async () => {
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          showQeStatus('error', '浏览器不支持读取剪贴板，请手动粘贴');
          return;
        }
        const text = await navigator.clipboard.readText();
        if (!text || !text.trim()) {
          showQeStatus('warning', '剪贴板为空');
          return;
        }
        qeText.value = text;
        updateQeState();
        // 直接调用提取，不需要点击按钮
        await doExtract(null);
      } catch (e) {
        showQeStatus('error', '自动填充失败: ' + e.message);
      }
    }, 500);  // 等 500ms 确保页面完全加载
  });
})();

// ── 表单 AJAX 提交 + 重复企业处理 ─────────────────────────────────────────
const addForm = document.getElementById('add-company-form');
let _submitting = false;  // 防止重复提交

addForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  if (_submitting) return;
  _submitting = true;

  // 禁用提交按钮
  const submitBtns = addForm.querySelectorAll('button[type="submit"]');
  submitBtns.forEach(b => { b.disabled = true; });

  try {
    const fd = new FormData(addForm);
    fd.set('_ajax', '1');

    const resp = await fetch(addForm.action, { method: 'POST', body: fd });
    const result = await resp.json();

    if (result.code === 0) {
      // 成功：跳转
      window._enthubToast && window._enthubToast('success', '操作成功', result.message);
      setTimeout(() => { window.location.href = result.redirect; }, 300);
    } else if (result.code === 409) {
      // 重复企业：弹出三选项弹窗
      _showDuplicateModal(result.data, fd);
    } else {
      // 错误
      window._enthubToast && window._enthubToast('error', '操作失败', result.message);
    }
  } catch(err) {
    window._enthubToast && window._enthubToast('error', '网络错误', err.message);
  } finally {
    _submitting = false;
    submitBtns.forEach(b => { b.disabled = false; });
  }
});

// ── 重复企业处理弹窗 ──
function _showDuplicateModal(data, originalFormData) {
  const eid = data.existing_id;
  const ename = data.existing_name;
  const newPhones = data.new_phones || [];
  const newShareholders = data.new_shareholders || [];

  // 构建信息摘要
  let phoneBadge = '';
  if (data.has_new_phones) {
    phoneBadge = `<span style="display:inline-block;margin-left:6px;padding:1px 7px;background:#DCFCE7;color:#15803D;border-radius:10px;font-size:11px;font-weight:600;">${newPhones.length} 个新号码</span>`;
  } else {
    phoneBadge = `<span style="display:inline-block;margin-left:6px;padding:1px 7px;background:#F3F4F6;color:#9CA3AF;border-radius:10px;font-size:11px;">无新号码</span>`;
  }

  let shBadge = '';
  if (data.has_new_shareholders) {
    shBadge = `<span style="display:inline-block;margin-left:6px;padding:1px 7px;background:#FFEDD5;color:#C2410C;border-radius:10px;font-size:11px;font-weight:600;">${newShareholders.length} 个新股东</span>`;
  }

  // 新号码列表
  let phoneList = '';
  if (data.has_new_phones) {
    phoneList = `<div style="margin-top:6px;font-size:12px;color:#15803D;line-height:1.6;">${newPhones.map(p => '📞 ' + p).join('　')}</div>`;
  }

  // 新股东列表
  let shList = '';
  if (data.has_new_shareholders) {
    shList = `<div style="margin-top:4px;font-size:12px;color:#C2410C;line-height:1.6;">${newShareholders.map(s => '👤 ' + s).join('　')}</div>`;
  }

  // 选项卡片
  const hasMerge = data.has_new_phones || data.has_new_shareholders;
  const options = [
    {
      icon: '🔍', title: '查看已有企业',
      desc: '跳转到「' + ename + '」的详情页面，不做任何修改',
      action: () => { closeModal(); window.location.href = `/company/${eid}`; }
    },
    {
      icon: '✏️', title: '覆盖更新',
      desc: '用表单数据更新已有企业的工商字段（空字段不覆盖），同时追加新号码和新股东',
      action: async () => { closeModal(); await _resubmitWithAction(originalFormData, 'overwrite', eid); }
    },
  ];
  if (hasMerge) {
    const mergeParts = [];
    if (data.has_new_phones) mergeParts.push(`${newPhones.length} 个电话号码`);
    if (data.has_new_shareholders) mergeParts.push(`${newShareholders.length} 个股东`);
    options.push({
      icon: '➕', title: '仅合并新数据',
      desc: `只追加${mergeParts.join('和')}，不修改已有工商字段`,
      action: async () => { closeModal(); await _resubmitWithAction(originalFormData, 'merge_phones', eid); }
    });
  }

  const optionCards = options.map((opt, i) => `
    <div class="dup-option" data-idx="${i}" style="
      display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);
      border-radius:8px;cursor:pointer;transition:all 0.15s;margin-bottom:8px;">
      <div style="font-size:18px;flex-shrink:0;line-height:1.4;">${opt.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;">${opt.title}</div>
        <div style="font-size:11px;color:var(--text-muted);line-height:1.4;">${opt.desc}</div>
      </div>
    </div>
  `).join('');

  const content = `
    <div style="margin-bottom:10px;">
      <p style="margin:0;font-size:13px;color:var(--text);">
        <strong>「${ename}」</strong>已在数据库中
      </p>
      <div style="margin-top:4px;font-size:12px;color:var(--text-muted);">
        电话${phoneBadge}${shBadge}
      </div>
      ${phoneList}${shList}
    </div>
    <div style="margin-top:10px;">
      ${optionCards}
    </div>
  `;

  showModal('发现重复企业', content, [
    { text: '取消', class: 'btn btn-secondary', action: 'closeModal()' }
  ]);

  // 绑定卡片点击事件
  document.querySelectorAll('.dup-option').forEach(card => {
    card.addEventListener('mouseenter', () => {
      card.style.borderColor = 'var(--accent)';
      card.style.background = 'var(--accent-light, #FFF8F4)';
    });
    card.addEventListener('mouseleave', () => {
      card.style.borderColor = 'var(--border)';
      card.style.background = '';
    });
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      options[idx].action();
    });
  });
}

// ── 带操作参数重新提交 ──
async function _resubmitWithAction(originalFormData, action, existingId) {
  const fd = new FormData();
  for (const [key, value] of originalFormData.entries()) {
    fd.append(key, value);
  }
  fd.set('_ajax', '1');
  fd.set('_action', action);
  fd.set('_existing_id', String(existingId));

  window._enthubToast && window._enthubToast('info', '正在处理...', '');

  try {
    const resp = await fetch(addForm.action, { method: 'POST', body: fd });
    const result = await resp.json();

    if (result.code === 0) {
      window._enthubToast && window._enthubToast('success', '操作成功', result.message);
      setTimeout(() => { window.location.href = result.redirect; }, 300);
    } else {
      window._enthubToast && window._enthubToast('error', '操作失败', result.message);
    }
  } catch(err) {
    window._enthubToast && window._enthubToast('error', '网络错误', err.message);
  }
}
</script>
