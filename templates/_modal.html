<!-- 统一弹窗组件 -->
<div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(2px);">
    <div id="modal-container" style="background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-width: 500px; width: 90%; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;">
        <div id="modal-header" style="padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <h3 id="modal-title" style="margin: 0; font-size: 18px; font-weight: 600;"></h3>
            <button onclick="closeModal()" style="background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-muted); font-size: 20px; line-height: 1;">×</button>
        </div>
        <div id="modal-body" style="padding: 24px; overflow-y: auto; flex: 1;">
            <!-- 动态内容 -->
        </div>
        <div id="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px;">
            <!-- 动态按钮 -->
        </div>
    </div>
</div>

<script>
// 弹窗管理
function showModal(title, content, buttons = []) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = content;
    
    const footer = document.getElementById('modal-footer');
    footer.innerHTML = '';
    
    if (buttons.length === 0) {
        buttons = [{ text: '确定', class: 'btn btn-primary', action: 'closeModal()' }];
    }
    
    buttons.forEach(btn => {
        const button = document.createElement('button');
        button.textContent = btn.text;
        button.className = btn.class || 'btn btn-secondary';
        button.onclick = btn.action ? new Function(btn.action) : closeModal;
        footer.appendChild(button);
    });
    
    document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
}

// 确认弹窗
function showConfirm(title, message, onConfirm) {
    const content = `<p style="margin: 0; color: var(--text-secondary); line-height: 1.6;">${message}</p>`;
    const buttons = [
        { text: '取消', class: 'btn btn-secondary', action: 'closeModal()' },
        { text: '确定', class: 'btn btn-primary', action: '' }
    ];
    
    showModal(title, content, buttons);
    
    // 绑定确定按钮
    const confirmBtn = document.querySelector('#modal-footer .btn-primary');
    confirmBtn.onclick = () => {
        closeModal();
        onConfirm();
    };
}

// 输入弹窗
function showInput(title, message, placeholder, onConfirm) {
    const content = `
        <p style="margin: 0 0 16px 0; color: var(--text-secondary); line-height: 1.6;">${message}</p>
        <input type="text" id="modal-input" class="form-input" placeholder="${placeholder}" style="width: 100%;">
    `;
    const buttons = [
        { text: '取消', class: 'btn btn-secondary', action: 'closeModal()' },
        { text: '确定', class: 'btn btn-primary', action: '' }
    ];
    
    showModal(title, content, buttons);
    
    // 聚焦输入框
    setTimeout(() => {
        const input = document.getElementById('modal-input');
        input.focus();
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.querySelector('#modal-footer .btn-primary').click();
            }
        });
    }, 100);
    
    // 绑定确定按钮
    const confirmBtn = document.querySelector('#modal-footer .btn-primary');
    confirmBtn.onclick = () => {
        const value = document.getElementById('modal-input').value;
        closeModal();
        onConfirm(value);
    };
}

// 点击遮罩关闭
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') {
        closeModal();
    }
});

// ESC键关闭
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('modal-overlay').style.display === 'flex') {
        closeModal();
    }
});
</script>
